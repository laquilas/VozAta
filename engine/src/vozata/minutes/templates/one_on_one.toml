# One-on-one: topics, feedback, agreements, follow-ups.
order = 3

[en]
name = "One-on-one"
instructions = "This is a one-on-one between two people. Capture what was discussed, the feedback given in both directions and what each person agreed to do. Be factual and neutral."

[[en.sections]]
heading = "Topics"
guidance = "the subjects discussed, one bullet each with the main points"

[[en.sections]]
heading = "Feedback"
guidance = "feedback given, saying who gave it to whom"

[[en.sections]]
heading = "Agreements"
guidance = "what the two people agreed on"

[[en.sections]]
heading = "Follow-ups"
guidance = "each next step with its owner and due date when they were mentioned, and topics for the next one-on-one"

["pt-BR"]
