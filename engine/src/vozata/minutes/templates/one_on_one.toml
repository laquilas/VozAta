instructions = "Esta é uma conversa individual (one-on-one) entre duas pessoas. Registre o que foi discutido, o feedback dado nos dois sentidos e o que cada pessoa se comprometeu a fazer. Seja factual e neutro."

[["pt-BR".sections]]
heading = "Tópicos"
guidance = "os assuntos discutidos, um item cada com os pontos principais"

[["pt-BR".sections]]
heading = "Feedback"
guidance = "o feedback dado, dizendo quem deu a quem"

[["pt-BR".sections]]
heading = "Combinados"
guidance = "o que as duas pessoas combinaram"

[["pt-BR".sections]]
heading = "Próximos passos"
guidance = "cada próximo passo com responsável e prazo quando tiverem sido mencionados, e temas para o próximo one-on-one"

