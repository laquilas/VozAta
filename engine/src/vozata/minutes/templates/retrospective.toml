# Retrospective: went well, to improve, actions.
order = 5

[en]
name = "Retrospective"
instructions = "This is a team retrospective. Capture what the team thinks went well, what should improve and the concrete actions agreed. Group similar points together instead of repeating them."

[[en.sections]]
heading = "Went well"
guidance = "what the team wants to keep doing"

[[en.sections]]
heading = "To improve"
guidance = "problems and frustrations raised, grouped by theme"

[[en.sections]]
heading = "Actions"
guidance = "each improvement action with its owner and due date when they were mentioned"

