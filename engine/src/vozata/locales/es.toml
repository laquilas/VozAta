[cli.help]
serve = "ejecuta la API HTTP + WebSocket local que usa la aplicación de escritorio"
description = "Transcripción de reuniones casi en tiempo real y generación de actas."
record = "graba el micrófono y el audio del sistema con transcripción en vivo"
language = "idioma hablado en la reunión (predeterminado: TRANSCRIPTION_LANGUAGE)"
mic = "id del micrófono (predeterminado: el micrófono predeterminado de Windows)"
system = "id del dispositivo de loopback (predeterminado: el loopback de la salida predeterminada)"
