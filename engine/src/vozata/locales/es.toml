[languages]
en = "inglés"
pt = "portugués"
es = "español"
auto = "el idioma hablado en la transcripción"

[minutes]
output_language = "español"
system = "Redactas actas de reunión precisas y concisas. Usa solo hechos presentes en la transcripción o en las notas; nunca inventes nombres, fechas, números ni decisiones."
instructions = """La reunión se realizó en {conversation_language}. {template_instructions}
Redacta el acta en {output_language}, en Markdown, con exactamente estos encabezados de nivel 2, en este orden:
{sections}
Qué va en cada encabezado:
{guidance}
En un encabezado sin contenido, escribe "—"."""
map_instructions = """Esta es la parte {part} de {total} de una reunión realizada en {conversation_language}. {template_instructions}
Escribe notas concisas en {output_language} con lo que esta parte dice para estos encabezados:
{guidance}
Usa solo hechos de esta parte."""
reduce_instructions = "Estas son notas de partes consecutivas de una misma reunión realizada en {conversation_language}. Combínalas en el acta de la reunión."
transcript_label = "Transcripción:"
notes_label = "Notas:"

