invalid_duration = "Invalid value \"{value}\" for {key}: expected seconds (0, -1, 300) or a duration such as 5m or 1h30m."
unknown_key = "Unknown setting {key}."
no_word_timestamps = "The speech API at {host} returned no word timestamps for model \"{value}\". Choose a model that supports timestamp_granularities=word."
missing_hf_token = "{key} is not set. Speaker identification needs a Hugging Face access token: create one at huggingface.co, accept the terms of the pyannote model, then set {key} in the settings."

[errors.session]
audio_unavailable = "Windows audio did not respond. Restart the Windows Audio service or the PC and try again."
device_timeout = "The audio device \"{device}\" did not open within {seconds} s. Check that it is connected and not in use by another app; if it keeps failing, restart Windows Audio or the PC."
device_failed = "The audio device \"{device}\" could not be opened: {reason}"
diarization_failed = "The remote speakers could not be identified ({reason}). The transcript keeps the system label; retry with: {command}"
live_diarization_failed = "Live speaker labels are off ({reason}). Recording continues; remote lines show the system label until the session stops."
mix_failed = "mixed.wav could not be created ({reason}). The microphone and system tracks were kept."
minutes_failed = "The minutes could not be generated ({reason}). The recording and transcript were kept; retry with: {command}"
model_failed = "The speech model could not be loaded ({reason}). Recording continues: the audio is saved, but it is not transcribed."
index_failed = "The session could not be added to the search index ({reason}). Rebuild the index with: python -m vozata reindex"
translation_failed = "Live translation stopped ({reason}). The transcription continues."

[errors.api]
unsupported_format = "Unsupported export format \"{format}\". Use one of: {allowed}."
settings_write_failed = "The settings file could not be saved ({reason}). Close programs that may be using it, such as a sync tool, and try again."
minutes_failed = "The minutes could not be generated ({reason}). Check that Ollama is running and the model is pulled."
empty_transcript = "Session \"{id}\" has no transcript, so there is nothing to summarize."
vocabulary_failed = "The vocabulary file could not be read or saved ({reason})."
unknown_template = "Unknown minutes template \"{id}\". Use one of: {allowed}."
unknown_speaker = "Unknown speaker \"{id}\" for this session. Use one of: {allowed}."
not_found = "This endpoint does not exist."
method_not_allowed = "This method is not allowed on this endpoint."
http_error = "The request failed with HTTP status {status}."
session_already_active = "A recording is already in progress or still being finalized. Stop it, or wait until it finishes."
no_active_session = "No recording is in progress."
session_not_found = "Session \"{id}\" was not found."
minutes_not_found = "Session \"{id}\" has no minutes yet."
session_still_recording = "Session \"{id}\" is still recording; minutes are generated when it stops."
unknown_segment = "Segment \"{id}\" is not in the current transcript. Reload the transcript and try again."
empty_segment_text = "Segment \"{id}\" cannot be empty. Type its text, or revert the change."
transcript_still_recording = "Session \"{id}\" is still recording; edit the transcript after it stops."
device_not_found = "Audio device not found: {reason}"
invalid_request = "Invalid request: {details}"
internal_error = "Unexpected engine error. Check the engine log for details."
answer_failed = "The question could not be answered ({reason}). Check that Ollama is running and the model is pulled."
answer_in_progress = "Another question is still being answered. Wait until it finishes, then ask again."
ask_unavailable = "Asking questions about meetings is not available in this engine."

[languages]
en = "English"
pt = "Portuguese"
es = "Spanish"
auto = "the language spoken in the transcript"

[minutes]
output_language = "English"
system = "You write accurate, concise meeting minutes. Use only facts stated in the transcript or notes; never invent names, dates, numbers or decisions."
instructions = """The meeting was held in {conversation_language}. {template_instructions}
Write the minutes in {output_language}, in Markdown, with exactly these level-2 headings, in this order:
{sections}
What goes under each heading:
{guidance}
Under a heading with nothing to report, write "—"."""
map_instructions = """This is part {part} of {total} of a meeting held in {conversation_language}. {template_instructions}
Write concise notes in {output_language} with what this part says for these headings:
{guidance}
Use only facts from this part."""
reduce_instructions = "These are notes from consecutive parts of one meeting held in {conversation_language}. Combine them into the meeting minutes."
glossary = "Glossary: these names and terms may appear in the transcript, possibly misheard. Use exactly these spellings: {terms}"
transcript_label = "Transcript:"
notes_label = "Notes:"

[qa]
system = "You answer questions about recorded meetings using only the meeting excerpts you are given. Never invent names, dates, numbers or decisions. If the excerpts do not contain the answer, say that it was not found in the meetings."
instructions = """Answer the question in {output_language}, concisely, using only the excerpts below.
After each statement, cite the excerpt line it comes from as [session_id@hh:mm:ss], copying the session id and the time exactly as they appear, for example [{example}].
If the excerpts do not answer the question, reply only: {not_found}"""
context_label = "Meeting excerpts:"
session_header = "Session {id} ({date}):"
question_label = "Question:"
not_found = "I could not find this in the meetings."
stopwords = "a about above after again all also am an and any are as at be been before being below between both but by can could did do does doing done down during each few for from further had has have having he her here hers him his how i if in into is it its just me more most my no nor not now of off on once only or other our out over own please said same she should so some such tell than that the their them then there these they this those through to too under until up us very was we were what when where which while who whom why will with would you your"

