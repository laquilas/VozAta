[labels]
mic = "Me"
system = "Others"
user = "User {n}"

[errors.config]
invalid_choice = "Invalid value \"{value}\" for {key}. Allowed values: {allowed}."
not_a_number = "Invalid value \"{value}\" for {key}: expected a number."
out_of_range = "Invalid value \"{value}\" for {key}: must be between {min} and {max}."
invalid_url = "Invalid value \"{value}\" for {key}: expected an http:// or https:// URL."
invalid_duration = "Invalid value \"{value}\" for {key}: expected seconds (0, -1, 300) or a duration such as 5m or 1h30m."
unknown_key = "Unknown setting {key}."
no_word_timestamps = "The speech API at {host} returned no word timestamps for model \"{value}\". Choose a model that supports timestamp_granularities=word."

[errors.session]
audio_unavailable = "Windows audio did not respond. Restart the Windows Audio service or the PC and try again."
device_timeout = "The audio device \"{device}\" did not open within {seconds} s. Check that it is connected and not in use by another app; if it keeps failing, restart Windows Audio or the PC."
device_failed = "The audio device \"{device}\" could not be opened: {reason}"
mix_failed = "mixed.wav could not be created ({reason}). The microphone and system tracks were kept."
minutes_failed = "The minutes could not be generated ({reason}). The recording and transcript were kept; retry with: {command}"
model_failed = "The speech model could not be loaded ({reason}). Recording continues: the audio is saved, but it is not transcribed."

[errors.api]
unsupported_format = "Unsupported export format \"{format}\". Use one of: {allowed}."
settings_write_failed = "The settings file could not be saved ({reason}). Close programs that may be using it, such as a sync tool, and try again."
minutes_failed = "The minutes could not be generated ({reason}). Check that Ollama is running and the model is pulled."
empty_transcript = "Session \"{id}\" has no transcript, so there is nothing to summarize."
not_found = "This endpoint does not exist."
method_not_allowed = "This method is not allowed on this endpoint."
http_error = "The request failed with HTTP status {status}."
session_already_active = "A recording is already in progress or still being finalized. Stop it, or wait until it finishes."
no_active_session = "No recording is in progress."
session_not_found = "Session \"{id}\" was not found."
minutes_not_found = "Session \"{id}\" has no minutes yet."
session_still_recording = "Session \"{id}\" is still recording; minutes are generated when it stops."
device_not_found = "Audio device not found: {reason}"
invalid_request = "Invalid request: {details}"
internal_error = "Unexpected engine error. Check the engine log for details."

[languages]
en = "English"
pt = "Portuguese"
es = "Spanish"
auto = "the language spoken in the transcript"

[minutes]
output_language = "English"
system = "You write accurate, concise meeting minutes. Use only facts stated in the transcript or notes; never invent names, dates, numbers or decisions."
instructions = """The meeting was held in {conversation_language}. Write the minutes in {output_language}, in Markdown, with exactly these level-2 headings, in this order:
{sections}
List action items with their owner and due date when they were mentioned. Under a section with nothing to report, write "—"."""
map_instructions = "This is part {part} of {total} of a meeting held in {conversation_language}. Write concise notes in {output_language} with the topics, decisions, action items (owner, due date) and open issues of this part. Use only facts from this part."
reduce_instructions = "These are notes from consecutive parts of one meeting held in {conversation_language}. Combine them into the meeting minutes."
transcript_label = "Transcript:"
notes_label = "Notes:"

[minutes.section]
context = "Context"
summary = "Summary"
topics = "Topics"
decisions = "Decisions"
action_items = "Action items"
open_issues = "Open issues"

[cli]
serving = "Engine API listening on {url} (Ctrl+C to stop)."
serve_public_host = "Refusing to listen on {host}: the engine API has no authentication. Use 127.0.0.1 or localhost in API_HOST."
loading_model = "Loading the speech recognition model — already recording..."
model_ready = "Speech recognition model ready."
remote_stt = "Speech recognition runs on {host}: the audio is sent there."
recording = "Recording to {folder}"
controls = "Press p + Enter to pause or resume, Ctrl+C to stop."
paused = "Paused: the audio is replaced by silence and not transcribed. Press p + Enter to resume."
resumed = "Resumed."
paused_marker = "PAUSED"
finalizing = "Stopping: finishing the transcript, saving the audio and writing the minutes. Please wait..."
saved = "Saved to {folder}"
language_detected = "Detected language: {language}"
minutes_ready = "Minutes written to minutes.md."
minutes_written = "Minutes written to {path}"
minutes_failed = "The minutes could not be generated ({reason}). Check that Ollama is running and the model is pulled."
session_not_found = "No session found in {folder}."
empty_transcript = "The session in {folder} has no transcript, so there is nothing to summarize."
device_not_found = "Audio device not found: {reason}. Run \"python -m vozata record --list-devices\" to see the ids."

[cli.devices]
microphones = "Microphones:"
loopbacks = "System audio (loopback):"
default = "default"

[cli.help]
serve = "run the local HTTP + WebSocket API used by the desktop app"
description = "Near-real-time meeting transcription and minutes."
record = "record the microphone and the system audio with a live transcript"
language = "language spoken in the meeting (default: TRANSCRIPTION_LANGUAGE)"
mic = "microphone device id (default: the Windows default microphone)"
system = "loopback device id (default: the default output's loopback)"
list_devices = "list the audio devices and exit"
minutes = "generate the minutes of a recorded session again"
session_dir = "session folder, e.g. recordings/20261015_202358"

[export]
title = "Meeting of {date}"
duration = "Duration: {value}"
language = "Language: {value}"
minutes = "Minutes"
transcript = "Transcript"
no_minutes = "No minutes were generated for this session."
column_time = "Time"
column_speaker = "Speaker"
column_text = "Text"
