[minutes]
output_language = "português do Brasil"
system = "Você escreve atas de reunião precisas e concisas. Use apenas fatos presentes na transcrição ou nas notas; nunca invente nomes, datas, números ou decisões."
instructions = """A reunião foi conduzida em {conversation_language}. {template_instructions}
Escreva a ata em {output_language}, em Markdown, com exatamente estes títulos de nível 2, nesta ordem:
{sections}
O que vai em cada título:
{guidance}
Em um título sem conteúdo, escreva "—"."""
map_instructions = """Esta é a parte {part} de {total} de uma reunião conduzida em {conversation_language}. {template_instructions}
Escreva notas concisas em {output_language} com o que esta parte diz para estes títulos:
{guidance}
Use apenas fatos desta parte."""
reduce_instructions = "Estas são notas de partes consecutivas de uma mesma reunião conduzida em {conversation_language}. Combine-as na ata da reunião."
glossary = "Glossário: estes nomes e termos podem aparecer na transcrição, talvez reconhecidos de forma errada. Use exatamente esta grafia: {terms}"
meeting_title = "O usuário deu a esta reunião o título \"{title}\". Use o título como contexto para a ata, não como algo que foi dito."
transcript_label = "Transcrição:"
notes_label = "Notas:"

[qa]
system = "Você responde perguntas sobre reuniões gravadas usando apenas os trechos de reunião fornecidos. Nunca invente nomes, datas, números ou decisões. Se os trechos não contiverem a resposta, diga que ela não foi encontrada nas reuniões."
instructions = """Responda à pergunta em {output_language}, de forma concisa, usando apenas os trechos abaixo.
Após cada afirmação, cite a linha do trecho de onde ela vem como [session_id@hh:mm:ss], copiando o id da sessão e o horário exatamente como aparecem, por exemplo [{example}].
Se os trechos não responderem à pergunta, responda apenas: {not_found}"""
context_label = "Trechos das reuniões:"
session_header = "Sessão {id} ({date}):"
question_label = "Pergunta:"
not_found = "Não encontrei isso nas reuniões."
stopwords = "a ao aos aquela aquele aquilo as até com como da das de dela dele deles depois diga disse do dos e é ela ele eles em entre era essa esse esta está este eu fez fizemos foi foram há isso já lhe mais mas me mesmo meu minha muito na nas não nem no nos nós o os ou para pela pelo por porque qual quais quando que quem se sem ser seu sua são só sobre também te tem têm teve tinha um uma umas uns você vocês vos"

[action_items]
system = "Você extrai itens de ação de transcrições de reuniões: tarefas concretas que alguém combinou ou recebeu para fazer. Use apenas o que a transcrição diz; nunca invente tarefas, responsáveis ou datas."
instructions = """A reunião foi realizada em {conversation_language}. Liste os itens de ação em JSON.
Para cada item informe: "description", uma frase curta no imperativo em {output_language}; "owner", o nome ou rótulo da pessoa responsável como aparece na transcrição, ou null; "due", o prazo como AAAA-MM-DD quando for possível deduzi-lo, senão como foi dito, ou null; "source_segment_ids", os ids entre colchetes no início das linhas que mencionam a tarefa.
Retorne {{"items": []}} quando não houver itens de ação."""
meeting_date = "A reunião aconteceu em {date}."
part = "Esta é a parte {part} de {total} da reunião."
transcript_label = "Transcrição (cada linha começa com seu id):"

