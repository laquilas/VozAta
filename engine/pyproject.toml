[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vozata"
dynamic = ["version"]
description = "Near-real-time meeting transcription and LLM-generated meeting minutes."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2",
    "soxr",
    "PyAudioWPatch; sys_platform == 'win32'",
    "faster-whisper>=1.2",
    "python-dotenv",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "python-docx",
    "fpdf2",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
dev = ["pytest", "pytest-cov", "ruff", "pypdf"]
package = ["pyinstaller"]  # packaging/engine.spec (phase 13)

[tool.setuptools.dynamic]
version = { attr = "vozata.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vozata = ["locales/*.toml", "export/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not gpu'"
markers = ["gpu: needs an NVIDIA GPU and downloaded Whisper models (run with -m gpu)"]

[tool.coverage.run]
source = ["vozata"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
# Protocol method bodies.
exclude_also = ['^\s*\.\.\.$']
