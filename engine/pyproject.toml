[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vozata"
dynamic = ["version"]
description = "Near-real-time meeting transcription and LLM-generated meeting minutes."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2",
    "soxr",
    "PyAudioWPatch; sys_platform == 'win32'",
    "faster-whisper>=1.2",
    "av>=12",  # phase 60: audio files decoded by FFmpeg (also a faster-whisper dependency)
    "python-dotenv",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "python-docx",
    "fpdf2",
    "Send2Trash",  # deleted file-backend sessions go to the Recycle Bin (phase 36)
    # Model downloads with progress (phase 42): relies on 2.x snapshot_download (two byte bars
    # fed through tqdm_class, IncompleteSnapshotError in the cache check).
    "huggingface_hub>=2.2,<3",
    "anthropic>=2.2,<3",  # Claude as the language model (phase 53), the official SDK
    "pycaw; sys_platform == 'win32'",  # which apps use the audio devices (phase 54)
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
dev = ["pytest", "pytest-cov", "ruff", "pypdf"]
# Speaker identification (phase 14). For CUDA, install the CUDA build of torch first:
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
diarization = ["pyannote.audio>=4", "torch"]
# Live translation (phase 29): Opus-MT on CTranslate2 (ctranslate2 comes with faster-whisper).
translation = ["sentencepiece", "huggingface_hub"]
package = ["pyinstaller", "uv"]  # packaging/engine.spec (phase 13); uv.exe for the speaker runtime (56)

[tool.setuptools.dynamic]
version = { attr = "vozata.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vozata = ["locales/*.toml", "export/fonts/*", "minutes/templates/*.toml", "api/static/*",
          "storage/sqlite/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# `HF_HUB_DISABLE_XET` is set before the imports: huggingface_hub reads it once (phase 42).
"src/vozata/__main__.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not gpu'"
markers = ["gpu: needs an NVIDIA GPU and downloaded Whisper models (run with -m gpu)"]

[tool.coverage.run]
source = ["vozata"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
# Protocol method bodies.
exclude_also = ['^\s*\.\.\.$']
