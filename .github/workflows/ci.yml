name: Checks

# Quick checks for pull requests into main: lint, format and compile errors only, on Linux
# runners (cheaper than Windows). The test suites run in full-ci.yml (tags, releases, manual).
# Run the tests locally before opening a PR (see CLAUDE.md).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Syntax
        run: python -m compileall -q src tests

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release
